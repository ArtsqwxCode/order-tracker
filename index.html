<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статус заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f8f9fa; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .step { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
        .done { color: #2ecc71; }
        .active { color: #3498db; font-weight: bold; }
        .inactive { color: #ccc; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Загрузка...</h2>
        <div id="list"></div>
    </div>
    <script>
        const statuses = ["1. Едет от продавца на склад в ЕС.", "2. На складе в ЕС", "3. В пути на промежуточный склад в ЕС.", "4. На промежуточном складе в ЕС.", "5. На пути в РБ", "6. На почте в РБ", "7. Доставлено / Закрыто"];
        async function load() {
            const id = new URLSearchParams(window.location.search).get('order');
            document.getElementById('title').innerText = "Заказ №" + id;
            const res = await fetch("https://docs.google.com/spreadsheets/d/1ud4t6ga4HiN2D-57Z9mR54E7j3psalztGFMNlREurC4/export?format=csv&gid=793575032");
            const csv = await res.text();
            const row = csv.split('\n').slice(3).find(r => r.split(',')[0].trim() == id);
            if(row) {
                const cur = row.split(',')[2].trim();
                const curIdx = statuses.indexOf(cur);
                statuses.forEach((s, i) => {
                    const div = document.createElement('div');
                    div.className = 'step ' + (i < curIdx ? 'done' : i == curIdx ? 'active' : 'inactive');
                    div.innerText = (i < curIdx ? '✅ ' : i == curIdx ? '➡️ ' : '⚪ ') + s;
                    document.getElementById('list').appendChild(div);
                });
            }
        }
        load();
    </script>
</body>
</html>
