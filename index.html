<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Отслеживание заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 20px;
            color: #1c1c1e;
            -webkit-font-smoothing: antialiased;
        }
        .app-container {
            width: 100%;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 28px;
            border-bottom: 1px solid #f2f2f7;
            padding-bottom: 20px;
        }
        .img-preview {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            object-fit: cover;
            background-color: #f2f2f7;
            flex-shrink: 0;
        }
        .header-text {
            display: flex;
            flex-direction: column;
        }
        .order-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8e8e93;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .order-id {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 4px 0;
            color: #1c1c1e;
        }
        .receiver {
            font-size: 14px;
            color: #8e8e93;
        }
        .receiver span {
            color: #1c1c1e;
            font-weight: 600;
        }
        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #8e8e93;
            margin: 0 0 24px 0;
        }
        .timeline {
            display: flex;
            flex-direction: column;
            position: relative;
            margin-bottom: 35px;
        }
        .step {
            display: flex;
            align-items: flex-start;
            position: relative;
            padding-bottom: 28px;
        }
        .step:last-child {
            padding-bottom: 0;
        }
        /* Линия трекера */
        .step::before {
            content: '';
            position: absolute;
            left: 7px;
            top: 14px;
            width: 2px;
            height: calc(100% - 6px);
            background-color: #e5e5ea;
            z-index: 1;
        }
        .step.done::before {
            background-color: #34c759;
        }
        .step.active::before {
            background-color: #e5e5ea;
        }
        .step:last-child::before {
            display: none;
        }
        /* Кружки статусов */
        .indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            position: relative;
            z-index: 2;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .step.done .indicator {
            background-color: #34c759;
        }
        .step.done .indicator::after {
            content: '';
            width: 4px;
            height: 7px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }
        .step.active .indicator {
            background-color: #007aff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.2);
        }
        .step.pending .indicator {
            background-color: #e5e5ea;
        }
        /* Текст статусов */
        .step-text {
            font-size: 15px;
            line-height: 1.2;
        }
        .step.pending .step-text {
            color: #aeaeb2;
        }
        .step.active .step-text {
            color: #007aff;
            font-weight: 700;
        }
        .step.done .step-text {
            color: #1c1c1e;
            font-weight: 500;
        }
        /* Блок "Обновлено" внизу */
        .updated-box {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8e8e93;
            font-size: 16px; /* Крупный и читаемый шрифт, как ты просил */
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f2f2f7;
        }
        .updated-box svg {
            width: 18px;
            height: 18px;
            fill: #8e8e93;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <img id="photo" class="img-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='70' height='70' viewBox='0 0 70 70'><rect width='70' height='70' fill='%23f2f2f7'/></svg>" alt="Товар">
            <div class="header-text">
                <div class="order-label">Заказ</div>
                <h2 id="order-num" class="order-id">№...</h2>
                <div id="receiver" class="receiver">Получатель: <span>Загрузка...</span></div>
            </div>
        </div>
        
        <h3 class="section-title">Статус доставки</h3>
        <div id="status-list" class="timeline"></div>

        <div id="updated-container" class="updated-box" style="display: none;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <span id="updated-text">Обновлено: ...</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const statuses = [
            "1. Едет от продавца на склад в ЕС.",
            "2. На складе в ЕС",
            "3. В пути на промежуточный склад в ЕС.",
            "4. На промежуточном складе в ЕС.",
            "5. На пути в РБ",
            "6. На почте в РБ",
            "7. Доставлено / Закрыто"
        ];

        function parseCSVLine(text) {
            let ret = [];
            let inQuote = false;
            let cell = "";
            for (let i = 0; i < text.length; i++) {
                let ch = text[i];
                if (ch === '"') {
                    inQuote = !inQuote;
                } else if (ch === ',' && !inQuote) {
                    ret.push(cell.trim());
                    cell = "";
                } else {
                    cell += ch;
                }
            }
            ret.push(cell.trim());
            return ret;
        }

        async function init() {
            const orderId = new URLSearchParams(window.location.search).get('order') || "";
            document.getElementById('order-num').innerText = "№" + orderId;

            try {
                const res = await fetch("https://docs.google.com/spreadsheets/d/1ud4t6ga4HiN2D-57Z9mR54E7j3psalztGFMNlREurC4/export?format=csv&gid=793575032");
                const csvText = await res.text();
                const lines = csvText.replace(/\r/g, '').split('\n');
                
                const headers = parseCSVLine(lines[2]);
                const orderIdx = headers.findIndex(h => h.toLowerCase().includes("заказ") || h.toLowerCase().includes("id"));
                const fioIdx = headers.findIndex(h => h.toLowerCase().includes("фио") || h.toLowerCase().includes("контакт"));
                const statusIdx = headers.findIndex(h => h.toLowerCase().includes("статус"));
                const photoIdx = headers.findIndex(h => h.toLowerCase().includes("фото") || h.toLowerCase().includes("ссылка"));
                // Ищем колонку с датой изменения/обновления
                const updatedIdx = headers.findIndex(h => h.toLowerCase().includes("обновлен") || h.toLowerCase().includes("дата") || h.toLowerCase().includes("время"));

                let foundRow = null;
                for (let i = 3; i < lines.length; i++) {
                    if (!lines[i]) continue;
                    const cols = parseCSVLine(lines[i]);
                    if (cols[orderIdx] && cols[orderIdx].replace(/\D/g, '') === orderId.replace(/\D/g, '')) {
                        foundRow = cols;
                        break;
                    }
                }

                if (foundRow) {
                    document.getElementById('receiver').innerHTML = "Получатель: <span>" + (foundRow[fioIdx] || "Не указан") + "</span>";
                    
                    if (foundRow[photoIdx] && foundRow[photoIdx].startsWith('http')) {
                        document.getElementById('photo').src = foundRow[photoIdx];
                    }

                    // Вывод даты обновления
                    if (updatedIdx !== -1 && foundRow[updatedIdx]) {
                        document.getElementById('updated-text').innerText = "Обновлено: " + foundRow[updatedIdx];
                        document.getElementById('updated-container').style.display = 'flex';
                    }

                    const currentStatus = foundRow[statusIdx] || "";
                    const matchNum = currentStatus.match(/^\d+/);
                    let curIdx = -1;
                    
                    if (matchNum) {
                        curIdx = statuses.findIndex(s => s.startsWith(matchNum[0]));
                    } else {
                        curIdx = statuses.findIndex(s => s.toLowerCase().includes(currentStatus.toLowerCase()));
                    }

                    const list = document.getElementById('status-list');
                    statuses.forEach((s, i) => {
                        const div = document.createElement('div');
                        let stateClass = 'pending';
                        if (i < curIdx) stateClass = 'done';
                        else if (i === curIdx) stateClass = 'active';

                        div.className = `step ${stateClass}`;
                        div.innerHTML = `<div class="indicator"></div><div class="step-text">${s}</div>`;
                        list.appendChild(div);
                    });
                } else {
                    document.getElementById('receiver').innerHTML = "<span style='color:#ff3b30;'>Заказ не найден</span>";
                }
            } catch (e) {
                document.getElementById('receiver').innerHTML = "<span style='color:#ff3b30;'>Ошибка загрузки базы данных</span>";
            }
        }
        init();
    </script>
</body>
</html>
